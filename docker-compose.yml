name: samui-rentals

services:
  app:
    build: .
    image: samui-rentals-app
    restart: always
    env_file: .env
    environment:
      # Внутри compose-сети хост БД — postgres, поэтому URL собираем здесь
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # При необходимости снять комментарий (только для отладки!):
    # ports:
    #   - "5432:5432"

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # NGINX_TEMPLATE=-ip в .env подключает HTTP-шаблон для работы без домена
      - ./nginx/templates${NGINX_TEMPLATE:-}:/etc/nginx/templates:ro
      - ./docker-data/certbot:/var/www/certbot
      - ./docker-data/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

  # Получение/продление сертификатов Let's Encrypt (запускается вручную или по cron):
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d example.com -d www.example.com ...
  certbot:
    image: certbot/certbot
    volumes:
      - ./docker-data/certbot:/var/www/certbot
      - ./docker-data/letsencrypt:/etc/letsencrypt

volumes:
  pgdata:
  uploads:

networks:
  internal:
